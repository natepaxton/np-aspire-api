# NGINX gateway: the single entry point for browser traffic.
#   /api/  -> API (path forwarded unchanged; the API owns versioning)
#   /      -> frontend (np-aspire static-site image, added later)

server_tokens off;

upstream api {
    server api:8080;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 10m;

    # Gateway liveness (used by the container health check).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }

    # Placeholder until np-aspire publishes its static-site image.
    location / {
        default_type text/plain;
        return 404 "Frontend not configured\n";
    }
}
