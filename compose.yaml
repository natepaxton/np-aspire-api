# Full stack in containers: `docker compose up --build`, then http://localhost:8080
# The Aspire AppHost remains the development orchestrator; this file is maintained by hand.
name: np-aspire

services:
  gateway:
    image: nginxinc/nginx-unprivileged:1.30.5-alpine
    ports:
      - '8080:8080'
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/NpAspire.Api/Dockerfile
    image: np-aspire-api:local
    # Not published to the host: all traffic goes through the gateway.
    expose:
      - '8080'
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Trust X-Forwarded-* headers from the gateway.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: 'true'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
